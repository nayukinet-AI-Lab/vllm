services:
  vllm:
    image: vllm-v100:latest
    build:
      context: ..
      dockerfile: docker-v100/Dockerfile.v100
    container_name: vllm-v100-server
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      vllm serve Qwen/Qwen2.5-14B-Instruct-GPTQ-Int4
        --quantization gptq
        --dtype half
        --max-model-len 2048
        --gpu-memory-utilization 0.95
        --enforce-eager

