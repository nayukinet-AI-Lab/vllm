name: Check rulesync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".rulesync/**"
      - "rulesync.jsonc"
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".claude/rules/**"
      - ".claude/skills/**"
      - ".claude/settings.json"
      - ".agents/skills/**"
      - ".mcp.json"
      - ".codex/memories/**"
      - ".cursor/rules/**"
      - ".roo/rules/**"
      - ".github/workflows/check_rulesync.yaml"
  push:
    branches:
      - main
    paths:
      - ".rulesync/**"
      - "rulesync.jsonc"
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".claude/rules/**"
      - ".claude/skills/**"
      - ".claude/settings.json"
      - ".agents/skills/**"
      - ".mcp.json"
      - ".codex/memories/**"
      - ".cursor/rules/**"
      - ".roo/rules/**"
      - ".github/workflows/check_rulesync.yaml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RULESYNC_VERSION: "16.33.0"

permissions:
  contents: read

jobs:
  check-rulesync:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"

      - name: Install rulesync
        run: npm install -g "rulesync@${RULESYNC_VERSION}"

      - name: Check generated AI settings
        run: |
          rulesync generate --check || {
            echo "::error::AI tool settings are out of sync. Edit .rulesync/rules/ or rulesync.jsonc, run rulesync generate, and commit the generated files."
            exit 1
          }
