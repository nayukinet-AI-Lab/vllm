name: GitHub Actions Security Analysis

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIZMOR_VERSION: "1.25.2"

jobs:
  zizmor:
    name: Reject high confidence, high severity findings
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          clean: false
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Run zizmor
        run: uvx "zizmor==${ZIZMOR_VERSION}" --no-online-audits --min-severity high --min-confidence high --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}
